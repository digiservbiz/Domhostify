# Temporary staging environment for runtime verification.
# The free PostgreSQL database expires after the provider's free-tier period;
# do not use this blueprint for production data.
services:
  - type: web
    name: domhostify-api-staging
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: domhostify-db-staging
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500

databases:
  - name: domhostify-db-staging
    databaseName: domhostify_staging
    user: domhostify_staging
    plan: free
