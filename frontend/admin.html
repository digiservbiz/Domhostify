<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DomHostify — Admin</title><style>:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2e;--line:#27334d;--muted:#9eabc4;--text:#f5f7ff;--accent:#91f2cf;--danger:#ff8f9a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:0 20px}.top{display:flex;justify-content:space-between;padding:22px 0;border-bottom:1px solid #ffffff14}.brand{font-weight:800}.brand span{color:var(--accent)}a{color:var(--accent)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:24px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row{padding:15px 0;border-bottom:1px solid var(--line)}button,select{border:1px solid var(--line);border-radius:9px;padding:9px 14px;margin:7px 7px 0 0;font-weight:800;cursor:pointer;background:#17213a;color:var(--text)}.approve{background:var(--accent);color:#06140f}.reject{background:#3a1f2a;color:#ffd5d9}.muted{color:var(--muted)}.danger{color:var(--danger)}.hidden{display:none}.audit{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:13px}.pill{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:999px;margin-right:5px}</style></head>
<body><header class="wrap top"><div class="brand">dom<span>hostify</span> admin</div><nav><a href="account.html">Account</a></nav></header><main class="wrap"><section id="gate" class="card"><h1>Admin dashboard</h1><p id="message" class="muted">Checking authenticated admin session…</p></section><section id="panel" class="card hidden"><h2>Marketplace moderation</h2><p class="muted">Moderation queue includes pending, approved, rejected and withdrawn listings. Approval requires verified ownership.</p><div class="toolbar"><select id="status" onchange="load()"><option value="">All statuses</option><option value="pending_review">Pending review</option><option value="active">Active</option><option value="rejected">Rejected</option><option value="withdrawn">Withdrawn</option></select><button onclick="load()">Refresh</button></div><div id="listings">Loading…</div></section></main>
<script>
const API_BASE=String(window.DOMHOSTIFY_API_BASE||'http://127.0.0.1:8000').replace(/\/+$/,'');const key='domhostify_access_token';const token=()=>sessionStorage.getItem(key);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch(API_BASE+path,{...options,headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json',...(options.headers||{})}});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.detail||'Request failed');return d}
async function init(){try{if(!token())throw new Error('Sign in as an admin first.');const me=await api('/api/v1/account/me');if(me.role!=='admin')throw new Error('Admin role required.');document.getElementById('message').textContent=me.email+' · authenticated admin';document.getElementById('panel').classList.remove('hidden');await load()}catch(e){document.getElementById('message').textContent=e.message;document.getElementById('message').className='danger'}}
async function load(){const root=document.getElementById('listings');root.textContent='Loading…';try{const status=document.getElementById('status').value;const rows=await api('/api/v1/admin/marketplace/listings'+(status?'?status='+encodeURIComponent(status):''));root.innerHTML=rows.length?rows.map(x=>'<div class="row"><strong>'+esc(x.domain)+'</strong><br><span class="muted">'+esc(x.currency)+' '+esc(x.asking_price)+' · <span class="pill">'+esc(x.listing_status)+'</span><span class="pill">ownership: '+esc(x.ownership_status)+'</span><span class="pill">moderation: '+esc(x.moderation_status)+'</span></span><br><button class="approve" onclick="review('+x.id+',\'approve\')">Approve</button><button class="reject" onclick="review('+x.id+',\'reject\')">Reject</button><button onclick="audit('+x.id+',this)">Audit</button><div id="audit-'+x.id+'"></div></div>').join(''):'<p class="muted">No marketplace listings match this filter.</p>'}catch(e){root.textContent=e.message}}
async function review(id,decision){if(decision==='approve'&&!confirm('Approve this listing? Ownership must already be verified.'))return;const note=prompt('Optional moderation note','');try{await api('/api/v1/admin/marketplace/listings/'+id+'/review',{method:'POST',body:JSON.stringify({decision,note:note||null})});await load()}catch(e){alert(e.message)}}
async function audit(id,button){const root=document.getElementById('audit-'+id);button.disabled=true;try{const rows=await api('/api/v1/admin/marketplace/listings/'+id+'/audit');root.innerHTML='<div class="audit">'+(rows.length?rows.map(x=>'<div><strong>'+esc(x.event_type)+'</strong> · '+esc(x.actor_type)+' · '+esc(x.created_at)+'<br><span class="muted">'+esc(x.event_note||'')+'</span></div>').join(''):'No audit events.')+'</div>'}catch(e){root.textContent=e.message}finally{button.disabled=false}}
init();
</script></body></html>
