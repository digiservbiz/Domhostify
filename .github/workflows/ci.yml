name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify clean database migration upgrade and downgrade
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Compile runtime smoke script
        run: python -m py_compile scripts/runtime_smoke.py
      - name: Run tests
        run: python -m pytest -q
