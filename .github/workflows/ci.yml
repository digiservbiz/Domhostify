name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: domhostify_ci
          POSTGRES_USER: domhostify_ci
          POSTGRES_PASSWORD: domhostify_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domhostify_ci -d domhostify_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify clean SQLite migration upgrade and downgrade
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Verify clean PostgreSQL migration upgrade and downgrade
        env:
          DATABASE_URL: postgresql+psycopg://domhostify_ci:domhostify_ci_password@localhost:5432/domhostify_ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Compile runtime smoke script
        run: python -m py_compile scripts/runtime_smoke.py
      - name: Run tests
        run: python -m pytest -q
